name: Sync music playlist

on:
  schedule:
    - cron: '15 1 * * 1' # Monday 08:15 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-music
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata extractor
        run: python -m pip install --upgrade yt-dlp
      - name: Validate sync safety
        run: python tests/test_music_sync.py
      - name: Sync and validate metadata before atomic replacement
        run: python scripts/sync-youtube-playlist.py
      - name: Commit only changed music data
        id: commit
        run: |
          if git diff --quiet -- public/data/music.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data/music.json
          git commit -m 'chore: sync music playlist'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  # GITHUB_TOKEN pushes do not trigger push workflows; explicitly reuse Pages.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
