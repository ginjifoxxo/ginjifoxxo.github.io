name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main # Also pick up the new data commit when called by sync-music.
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/navigation-start.js
          node --check public/music-gacha.js
          node --check public/reveal.js
          node --check public/background-music.js
          node --check public/gallery.js
          node --test tests/*.test.cjs
          python3 tests/test_music_sync.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
